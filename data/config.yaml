# Configuración del agente de matching
scoring:
  threshold: 70

  weights:
    mandatory_skills: 50
    desirable_skills: 20
    experience: 15
    english: 10
    availability: 5

relaxation:
  max_relaxations: 3

  order:
    - type: start_date
      weeks: 2

    - type: experience
      years: 1

    - type: english
      levels: 1

# Límites por corrida (RNF-04)
limits:
  max_monitoring_hours: 3   # horas simuladas por lectura de la bandeja (24 h reales)
  recursion_limit: 400      # tope de pasos del grafo; corta una corrida desbocada

recruiter:
  max_queries: 3

llm:
  max_calls_per_job: 30
  # OpenRouter (API compatible con OpenAI). Se puede sobreescribir con LLM_MODEL.
  model: anthropic/claude-3.5-haiku
  base_url: https://openrouter.ai/api/v1

agent:
  shortlist_size: 3
  mode: without_llm