# Configuración del agente de matching
scoring:
  threshold: 70

  weights:
    mandatory_skills: 50
    desirable_skills: 20
    experience: 15
    english: 10
    availability: 5

relaxation:
  max_relaxations: 3

  order:
    - type: start_date
      weeks: 2

    - type: experience
      years: 1

    - type: english
      levels: 1

# Límites por corrida (RNF-04)
limits:
  max_monitoring_hours: 3   # horas simuladas por lectura de la bandeja (24 h reales)
  recursion_limit: 400      # tope de pasos del grafo; corta una corrida desbocada

recruiter:
  max_queries: 3

# RF-08: rondas de aprobación humana de la shortlist (rechazo + reemplazo).
# Con el valor por defecto (3) cada puesto se puede reemplazar hasta 2 veces.
approval:
  max_reviews: 3

llm:
  # Con el plan gratis de OpenRouter (50 peticiones/día) 8 llamadas alcanzan
  # para las justificaciones del LLM; el resto usa la plantilla (RNF-08).
  max_calls_per_job: 8
  # OpenRouter (API compatible con OpenAI). Se puede sobreescribir con LLM_MODEL.
  # Los modelos gratis se saturan: `openrouter/free` enruta a otro modelo gratis
  # cuando uno está caído o saturado (429 del proveedor), así la secuencia no
  # se detiene. OJO: no evita el tope de la cuenta (`free-models-per-day`, 50
  # al día); si ese se agota, todo cae a la justificación por plantilla (RNF-08)
  # y el error queda en `errores` y en la auditoría. Para evadirlo: esperar al
  # reinicio diario, agregar créditos o usar Groq (LLM_BASE_URL + LLM_API_KEY).
  model: openrouter/free
  base_url: https://openrouter.ai/api/v1

agent:
  shortlist_size: 3
  mode: without_llm